name: Enrich Leads

# Fetches the sites of leads that already exist as CSVs (e.g. from a Find Leads run, which only
# commits CSVs, not the database) so a Claude Code session can read them for owner, email and
# LinkedIn. Commits the DB, fetched page text, and the Claude read-queue back to the repo.

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Comma-separated city keys whose data/leads CSVs to enrich"
        required: true
      fetch_limit:
        description: "Max sites to fetch (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  enrich-leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load city CSVs into the database
        run: |
          IFS=',' read -ra CITIES <<< "${{ github.event.inputs.cities }}"
          for c in "${CITIES[@]}"; do
            python run.py load-csv --city "$(echo "$c" | xargs)"
          done

      - name: Fetch sites + build Claude read-queue
        run: |
          LIMIT="${{ github.event.inputs.fetch_limit }}"
          python run.py enrich-prep ${LIMIT:+--limit "$LIMIT"}

      - name: Commit database, fetched text, and read-queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/leads.db data/raw data/work/needs_claude.jsonl
          git diff --cached --quiet || git commit -m "Enrich: fetch sites for ${{ github.event.inputs.cities }}"
          git push
