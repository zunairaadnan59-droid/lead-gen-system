# =====================================================================================
# Local Lead Finder - configuration
#
# Everything the tool does is driven from this file. The two things you will actually edit:
#   1. `icp.keywords`  - what kind of business you want (e.g. "plumber", "law firm", "gym")
#   2. `cities`        - which metros to search, with their area codes
# No API keys are needed for the default sources. See .env.example for the optional ones.
# =====================================================================================

# ---- Who counts as a lead -------------------------------------------------------------
icp:
  # Search phrases used across YellowPages / Yelp / OpenStreetMap. Add your niche here.
  keywords:
    - "boutique"
    - "online store"
    - "ecommerce store"
    - "gift shop"
    - "clothing boutique"
    - "home decor store"
    - "jewelry store"
    - "specialty retailer"
  # Titles the Claude owner-extraction pass treats as the decision-maker.
  decision_titles: [founder, co-founder, owner, ceo, president, principal, partner, managing director]
  fit_min_score: 0        # export keeps contacts scoring >= this (0-5). 0 = keep everything.

# ---- Discovery behaviour --------------------------------------------------------------
discover:
  # Sources are tried in this order until the requested lead count is reached.
  #   designrush    - human-reviewed agency directory (agencies, not retailers - not used here)
  #   yellowpages   - broad local coverage, any business type
  #   yelp          - official Yelp Fusion API (only runs if YELP_API_KEY is set)
  #   openstreetmap - free & open, no key, universal fallback
  sources: [yellowpages, yelp, openstreetmap]
  page_delay_seconds: 2           # polite pause between directory pages
  yp_max_pages_per_keyword: 8
  dr_city_max_pages_per_category: 6
  # DesignRush lists different agencies under each service category; sweeping several
  # multiplies yield. (Only relevant if you keep `designrush` in `sources`.)
  dr_categories:
    - digital-marketing
    - search-engine-optimization
    - social-media-marketing
    - content-marketing
    - email-marketing
    - public-relations
    - video-production
    - website-design-development
    - conversion-optimization

# ---- Site fetching (for the /enrich-owners owner-name pass) ---------------------------
fetch:
  pages_to_try: ["", "about", "about-us", "team", "our-team", "contact", "contact-us", "company"]
  request_timeout_seconds: 10
  delay_seconds: 0.6              # polite delay between requests to one host
  max_pages_per_site: 3
  workers: 12                     # concurrent sites (different hosts, so this is safe & polite)
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"

# ---- Target cities --------------------------------------------------------------------
# area_codes drive local-presence matching (a lead is kept only if its phone is in one of
# these codes). `dr_slug` is the DesignRush URL path (state-name/city-name); leave it out and
# the other three sources still cover the city. `display` is only needed when the key is not
# already a clean city name. Add any US city by copying a block and filling in the area codes.
cities:
  # --- Texas ---
  houston:      { state: TX, area_codes: [713, 281, 832, 346], dr_slug: "texas/houston" }
  dallas:       { state: TX, area_codes: [214, 469, 972], dr_slug: "texas/dallas" }
  austin:       { state: TX, area_codes: [512, 737], dr_slug: "texas/austin" }
  sanantonio:   { state: TX, area_codes: [210, 726], dr_slug: "texas/san-antonio", display: "San Antonio" }
  # --- Florida ---
  miami:        { state: FL, area_codes: [305, 786], dr_slug: "florida/miami" }
  orlando:      { state: FL, area_codes: [321, 407, 689], dr_slug: "florida/orlando" }
  tampa:        { state: FL, area_codes: [813, 656], dr_slug: "florida/tampa" }
  # --- California ---
